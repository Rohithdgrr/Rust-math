[workspace]
resolver = "2"
members = [
    "crates/mathverse-core",
    "crates/mathverse-arithmetic",
    "crates/mathverse-algebra",
    "crates/mathverse-trigonometry",
    "crates/mathverse-geometry",
    "crates/mathverse-vector",
    "crates/mathverse-matrix",
    "crates/mathverse-linear-algebra",
    "crates/mathverse-calculus",
    "crates/mathverse-complex",
    "crates/mathverse-special",
    "crates/mathverse-probability",
    "crates/mathverse-statistics",
    "crates/mathverse-numerical",
    "crates/mathverse-equations",
    "crates/mathverse-number-theory",
    "crates/mathverse-combinatorics",
    "crates/mathverse-graph",
    "crates/mathverse-transforms",
    "crates/mathverse-signal",
    "crates/mathverse-image",
    "crates/mathverse-plot",
    "crates/mathverse-physics",
    "crates/mathverse-finance",
    "crates/mathverse-symbolic",
    "crates/mathverse-units",
    "crates/mathverse-ai",
    "crates/mathverse-machine-learning",
    "crates/mathverse-vision",
    "crates/mathverse-graphics",
    "crates/mathverse-prelude",
    "crates/mathverse-ndarray-interop",
    "crates/mathverse-parallel",
    "crates/mathverse-views",
    "crates/mathverse-benches",
    "crates/mathverse-dataframe",
    "crates/mathverse-gpu",
]

[workspace.package]
rust-version = "1.87"
edition = "2021"
description = "A comprehensive mathematics library for Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rohithdgrr/Rust-math"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
many_single_char_names = "allow"
too_many_arguments = "allow"
missing_errors_doc = "allow"
empty_line_after_doc_comments = "allow"
