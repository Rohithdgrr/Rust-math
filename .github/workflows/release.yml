name: CD - Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-bump
        run: cargo install cargo-bump --locked

      - name: Run cargo-bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract version from tag (strip 'v' prefix)
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Version: $VERSION"
          cargo bump "$VERSION" --verbose

      - name: Update changelog
        run: |
          # Use git-cliff if available, otherwise just commit
          git add Cargo.toml crates/*/Cargo.toml
          git commit -m "chore(release): bump version to v${GITHUB_REF#refs/tags/v}" || echo "No changes to commit"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:${GITHUB_REF#refs/tags/} || true

      - name: Publish workspace to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish in dependency order
          cargo publish -p mathverse-core --allow-dirty --token "$CARGO_REGISTRY_TOKEN" --no-verify
          sleep 10
          # Publish probability crate (depends on core)
          cargo publish -p mathverse-probability --allow-dirty --token "$CARGO_REGISTRY_TOKEN" --no-verify
          sleep 10
          # Publish trigonometry crate (depends only on core)
          cargo publish -p mathverse-trigonometry --allow-dirty --token "$CARGO_REGISTRY_TOKEN" --no-verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
