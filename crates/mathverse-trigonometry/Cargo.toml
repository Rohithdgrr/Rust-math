[package]
name = "mathverse-trigonometry"
version = "0.2.2"
edition = "2021"
rust-version.workspace = true
description = "MathVerse trigonometry: circular, hyperbolic, inverse functions, angle conversions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "trigonometry", "sin", "cos", "angles"]
categories = ["science", "mathematics"]
readme = "README.md"

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.0", default-features = false }

[features]
default = ["std"]
std = ["mathverse-core/std"]
libm = ["mathverse-core/libm"]

[lints]
workspace = true
