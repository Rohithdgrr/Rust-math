[package]
name = "mathverse-plot"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
authors = ["MathVerse Contributors"]
description = "Plotting with SVG, HTML, and terminal output backends"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.0" }
mathverse-statistics = { path = "../mathverse-statistics", version = "0.1.2" }
mathverse-probability = { path = "../mathverse-probability", version = "0.1.2" }
mathverse-trigonometry = { path = "../mathverse-trigonometry", version = "0.2.1" }
mathverse-transforms = { path = "../mathverse-transforms", version = "0.1.0", optional = true }
mathverse-signal = { path = "../mathverse-signal", version = "0.1.0", optional = true }
mathverse-complex = { path = "../mathverse-complex", version = "0.2.0" }
mathverse-machine-learning = { path = "../mathverse-machine-learning", version = "0.1.0", optional = true }
mathverse-graphics = { path = "../mathverse-graphics", version = "0.1.0", optional = true }
mathverse-vector = { path = "../mathverse-vector", version = "0.1.0", optional = true }
mathverse-matrix = { path = "../mathverse-matrix", version = "0.1.0", optional = true }
mathverse-graph = { path = "../mathverse-graph", version = "0.1.0", optional = true }
thiserror = "2"
tiny-skia = { version = "0.12", optional = true }
resvg = { version = "0.48", optional = true }
usvg = { version = "0.48", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
printpdf = { version = "0.12", optional = true }
eframe = { version = "0.31", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "Document", "Window", "Element"] }

[features]
default = ["png", "ml", "signal", "graph"]
png = ["dep:tiny-skia", "dep:resvg", "dep:usvg", "dep:image"]
ml = ["dep:mathverse-machine-learning"]
signal = ["dep:mathverse-signal", "dep:mathverse-transforms"]
graph = ["dep:mathverse-graph", "dep:mathverse-graphics", "dep:mathverse-vector", "dep:mathverse-matrix"]
pdf = ["dep:printpdf"]
interactive = ["dep:eframe"]
canvas = ["dep:wasm-bindgen", "dep:web-sys"]


[lints]
workspace = true

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "plot_bench"
harness = false

[[example]]
name = "interactive"

[[example]]
name = "simple_ml_plots"
required-features = ["ml"]

[[example]]
name = "simple_spectrogram"
required-features = ["signal"]

[[example]]
name = "simple_graph_layout"
required-features = ["graph"]

[[example]]
name = "simple_surface"
required-features = ["graph"]

[[example]]
name = "simple_candlestick"
required-features = ["interactive"]
