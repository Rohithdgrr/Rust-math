[package]
name = "mathverse-ai"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
homepage = "https://github.com/Rohithdgrr/Rust-math"
documentation = "https://docs.rs/mathverse-ai"
description = "AI/ML mathematical primitives: tensors, activations, losses, optimizers, attention, autograd, layers, models"
keywords = ["ai", "machine-learning", "tensor", "neural-network", "deep-learning"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.1" }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["std"]
std = ["serde", "thiserror", "tracing"]
full = ["std", "serde", "thiserror", "tracing", "tokio/full"]

[profile.release]
opt-level = 3
lto = true

[profile.bench]
opt-level = 3
lto = true

[lints]
workspace = true
