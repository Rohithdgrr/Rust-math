[package]
name = "mathverse-equations"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
description = "MathVerse equations: scalar and linear-system solvers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "equations", "linear-systems", "solver", "polynomial"]
categories = ["science", "mathematics"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.1" }
mathverse-algebra = { path = "../mathverse-algebra", version = "0.1.1" }
mathverse-matrix = { path = "../mathverse-matrix", version = "0.1.1" }
mathverse-vector = { path = "../mathverse-vector", version = "0.1.1" }
mathverse-numerical = { path = "../mathverse-numerical", version = "0.1.1" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
full = []

[profile.bench]
debug = false

[profile.release]
opt-level = 3
lto = true

[lints]
workspace = true
