[package]
name = "mathverse-machine-learning"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Classical machine learning: regression, classification, clustering, ensembles, SVM, XGBoost, Gaussian Process, pipelines"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["machine-learning", "ml", "classification", "regression", "clustering"]
categories = ["algorithms", "science"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.0" }
mathverse-statistics = { path = "../mathverse-statistics", version = "0.1.0" }

[features]
default = ["std"]
std = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ml_benchmarks"
harness = false
