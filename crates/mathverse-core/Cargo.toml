[package]
name = "mathverse-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
description = "MathVerse core: numeric traits, errors, constants, precision utilities, generic operations, common algorithms"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "numeric", "traits", "constants", "precision"]
categories = ["science", "mathematics"]

[features]
default = ["std"]
std = []

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mathverse_bench"
harness = false
