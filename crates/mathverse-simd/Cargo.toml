[package]
name = "mathverse-simd"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "MathVerse SIMD acceleration: portable SIMD kernels for f64 operations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "simd", "performance", "acceleration", "vectorization"]
categories = ["science", "mathematics", "algorithms"]

[features]
default = ["std"]
std = []

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.0" }

[lints]
workspace = true
