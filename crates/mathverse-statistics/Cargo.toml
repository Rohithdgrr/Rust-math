[package]
name = "mathverse-statistics"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "MathVerse statistics: descriptive stats, distributions, hypothesis tests, regression, multivariate analysis, and inference"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "statistics", "regression", "hypothesis-testing", "descriptive"]
categories = ["science", "mathematics"]

[dependencies]
mathverse-core = { path = "../mathverse-core" }

[features]
default = ["std"]
std = []
