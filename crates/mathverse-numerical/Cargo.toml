[package]
name = "mathverse-numerical"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "MathVerse numerical methods: root finding, ODE integrators, interpolation, least squares"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "numerical", "root-finding", "ode", "interpolation"]
categories = ["science", "mathematics"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.0" }
mathverse-matrix = { path = "../mathverse-matrix", version = "0.1.0" }
mathverse-vector = { path = "../mathverse-vector", version = "0.1.0" }
mathverse-optimization = { path = "../mathverse-optimization", version = "0.1.0" }
rand = "0.9"


[lints]
workspace = true
[dev-dependencies]
rand = "0.9"
