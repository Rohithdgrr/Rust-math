[package]
name = "mathverse-matrix"
version = "0.1.2"
edition = "2021"
rust-version.workspace = true
description = "MathVerse dense and sparse matrices: ops, LU/QR/SVD/Cholesky, eigen, solve"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "matrix", "linear-algebra", "decomposition", "eigenvalue"]
categories = ["science", "mathematics"]

[features]
default = []
simd = []
parallel = []

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.2" }
mathverse-vector = { path = "../mathverse-vector", version = "0.1.2" }

[lints]
workspace = true
