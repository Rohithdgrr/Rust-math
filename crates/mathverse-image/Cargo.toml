[package]
name = "mathverse-image"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "MathVerse image processing: kernels, blur, Sobel, Canny, histogram, morphology"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["image", "processing", "computer-vision", "grayscale"]
categories = ["computer-vision", "science"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
rand = "0.9"


[lints]
workspace = true
[dev-dependencies]
criterion = "0.5"

