[package]
name = "mathverse-vision"
version = "0.1.2"
edition = "2021"
rust-version.workspace = true
description = "MathVerse computer vision: camera model, homography, epipolar geometry, features, optical flow"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "computer-vision", "homography", "camera", "optical-flow"]
categories = ["science", "mathematics", "computer-vision"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "pnm"] }
minifb = "0.27"
nokhwa = { version = "0.10", features = ["input-native"] }

[lints]
workspace = true
