[package]
name = "mathverse-prelude"
version = "0.1.2"
edition = "2021"
authors = ["MathVerse Contributors"]
description = "Comprehensive prelude for MathVerse - re-exports common items"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
rust-version.workspace = true

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.2" }
mathverse-algebra = { path = "../mathverse-algebra", version = "0.1.2" }
mathverse-calculus = { path = "../mathverse-calculus", version = "0.1.2" }
mathverse-trigonometry = { path = "../mathverse-trigonometry", version = "0.2.0" }
mathverse-statistics = { path = "../mathverse-statistics", version = "0.1.2" }
mathverse-probability = { path = "../mathverse-probability", version = "0.1.2" }
mathverse-linear-algebra = { path = "../mathverse-linear-algebra", version = "0.1.2" }
mathverse-matrix = { path = "../mathverse-matrix", version = "0.1.2" }
mathverse-vector = { path = "../mathverse-vector", version = "0.1.2" }
mathverse-complex = { path = "../mathverse-complex", version = "0.2.0" }
mathverse-special = { path = "../mathverse-special", version = "0.1.2" }
mathverse-physics = { path = "../mathverse-physics", version = "0.2.0" }
mathverse-finance = { path = "../mathverse-finance", version = "0.1.2" }
mathverse-symbolic = { path = "../mathverse-symbolic", version = "0.1.2" }
mathverse-units = { path = "../mathverse-units", version = "0.1.2" }
mathverse-plot = { path = "../mathverse-plot", version = "0.2.0", optional = true }
mathverse-number-theory = { path = "../mathverse-number-theory", version = "0.2.0" }
mathverse-combinatorics = { path = "../mathverse-combinatorics", version = "0.1.2" }
mathverse-graph = { path = "../mathverse-graph", version = "0.1.2" }
mathverse-transforms = { path = "../mathverse-transforms", version = "0.1.2" }
mathverse-signal = { path = "../mathverse-signal", version = "0.1.2" }
mathverse-numerical = { path = "../mathverse-numerical", version = "0.1.2" }
mathverse-equations = { path = "../mathverse-equations", version = "0.1.2" }
mathverse-ai = { path = "../mathverse-ai", version = "0.1.2" }
mathverse-machine-learning = { path = "../mathverse-machine-learning", version = "0.1.2" }
mathverse-vision = { path = "../mathverse-vision", version = "0.1.2" }
mathverse-graphics = { path = "../mathverse-graphics", version = "0.1.2" }
mathverse-ndarray-interop = { path = "../mathverse-ndarray-interop", version = "0.1.0" }
mathverse-parallel = { path = "../mathverse-parallel", version = "0.1.0" }
mathverse-views = { path = "../mathverse-views", version = "0.1.0" }

[lints]
workspace = true

[features]
default = []
plot = ["mathverse-plot"]
