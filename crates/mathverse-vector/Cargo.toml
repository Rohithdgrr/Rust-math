[package]
name = "mathverse-vector"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
description = "MathVerse dense vectors: dot, norms, angles, cross product"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
keywords = ["math", "vector", "linear-algebra", "norms", "dot-product"]
categories = ["science", "mathematics"]

[features]
default = []
simd = ["dep:wide"]
parallel = ["dep:rayon"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.1" }
wide = { version = "0.7", optional = true }
rayon = { version = "1.10", optional = true }

[lints]
workspace = true
