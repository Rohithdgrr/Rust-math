[package]
name = "mathverse-complex"
version = "0.2.1"
edition = "2021"
rust-version.workspace = true
description = "MathVerse complex numbers: arithmetic, powers, transcendental functions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rohithdgrr/Rust-math"
homepage = "https://github.com/Rohithdgrr/Rust-math"
documentation = "https://docs.rs/mathverse-complex"
readme = "README.md"
keywords = ["math", "complex-numbers", "imaginary", "mandelbrot", "fft"]
categories = ["science", "mathematics"]

[features]
default = []
serde = ["dep:serde"]
rand = ["dep:rand", "dep:rand_distr"]
blas = ["dep:ndarray"]

[dependencies]
mathverse-core = { path = "../mathverse-core", version = "0.1.3" }
serde = { version = "1", features = ["derive"], optional = true }
rand = { version = "0.8", optional = true }
rand_distr = { version = "0.4", optional = true }
ndarray = { version = "0.15", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "benchmark"
harness = false

[lints]
workspace = true
